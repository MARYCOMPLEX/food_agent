<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">XHS Food Agent platform connector integration architecture</title>
  <desc id="desc">Layered architecture showing FastAPI, composition root, canonical contracts, Temporal, account authority, platform connectors, PostgreSQL, Redis, ObjectStore and external providers. Account and secret isolation boundaries are highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-optional" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #cbd5e1; }
      .section { font: 700 16px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #bae6fd; letter-spacing: .6px; }
      .box-title { font: 700 18px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #f8fafc; }
      .box-path { font: 600 12px 'Cascadia Code','Consolas',monospace; fill: #7dd3fc; }
      .body { font: 400 13px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #dbeafe; }
      .small { font: 400 12px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 11px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #94a3b8; }
      .pill { font: 700 11px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .layer { fill: #172554; stroke: #334155; stroke-width: 1.2; rx: 18; }
      .box { fill: #1e293b; stroke: #475569; stroke-width: 1.2; rx: 12; filter: url(#shadow); }
      .box-blue { fill: #172554; stroke: #38bdf8; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .box-purple { fill: #2e1065; stroke: #a78bfa; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .box-green { fill: #052e2b; stroke: #2dd4bf; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .box-amber { fill: #422006; stroke: #fbbf24; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .box-red { fill: #450a0a; stroke: #fb7185; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .arrow { stroke: #7dd3fc; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-optional { stroke: #c4b5fd; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-optional); }
      .arrow-telemetry { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 3 5; fill: none; }
      .boundary { fill: none; stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 9 6; rx: 16; }
      .divider { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="url(#bg)"/>
  <rect x="0" y="0" width="1800" height="76" fill="url(#header)"/>
  <text x="48" y="38" class="title">XHS Food Agent · Platform Connector Integration</text>
  <text x="48" y="61" class="subtitle">Feature-gated Dianping + Spider_XHS (PC/Creator) · canonical contracts unchanged · account-aware execution</text>
  <text x="1748" y="37" text-anchor="end" class="small">OpenSpec: integrate-platform-source-connectors</text>
  <text x="1748" y="57" text-anchor="end" class="small">branch: codex/integrate-platform-source-connectors</text>

  <!-- Layer 1 -->
  <text x="48" y="108" class="section">01  EDGE &amp; COMPOSITION</text>
  <rect x="35" y="122" width="1730" height="178" class="layer"/>

  <rect x="58" y="145" width="300" height="126" class="box-blue"/>
  <text x="78" y="174" class="box-title">Web UI / API clients</text>
  <text x="78" y="194" class="box-path">frontend/ · React 19 + Vite</text>
  <text x="78" y="220" class="body">REST commands + SSE progress</text>
  <text x="78" y="241" class="body">Search / history / favorites / profile</text>
  <rect x="78" y="249" width="92" height="16" rx="8" fill="#7dd3fc"/><text x="124" y="261" text-anchor="middle" class="pill">PUBLIC EDGE</text>

  <rect x="407" y="145" width="390" height="126" class="box"/>
  <text x="427" y="174" class="box-title">FastAPI application</text>
  <text x="427" y="194" class="box-path">src/api (platform.py) · Uvicorn · SlowAPI</text>
  <text x="427" y="220" class="body">Request validation, rate limit, CORS</text>
  <text x="427" y="241" class="body">/v1/search · /v1/platform/* · /health</text>
  <text x="427" y="261" class="small">history/favorites + SSE; platform router is redacted</text>

  <rect x="846" y="145" width="390" height="126" class="box-purple"/>
  <text x="866" y="174" class="box-title">Composition Root</text>
  <text x="866" y="194" class="box-path">composition/root.py + platform_bindings.py</text>
  <text x="866" y="220" class="body">Atomic registry wiring / lifecycle / rollback</text>
  <text x="866" y="241" class="body">Flags: platform_*, provenance, license, queue</text>
  <text x="866" y="261" class="small">app.state runtime factory; disabled-by-default / fail-closed</text>

  <rect x="1285" y="145" width="422" height="126" class="box-green"/>
  <text x="1305" y="174" class="box-title">Canonical contracts</text>
  <text x="1305" y="194" class="box-path">src/xhs_food/contracts · Pydantic v2</text>
  <text x="1305" y="220" class="body">CollectRequest / Query Family / Evidence</text>
  <text x="1305" y="241" class="body">PlatformAccount / Session / Invocation</text>
  <text x="1305" y="261" class="small">Account ref + session version stay outside public identity</text>

  <path d="M358 208 H407" class="arrow"/>
  <path d="M797 208 H846" class="arrow"/>
  <path d="M1236 208 H1285" class="arrow"/>

  <!-- Layer 2 -->
  <text x="48" y="338" class="section">02  DOMAIN, GATEWAY &amp; DURABLE EXECUTION</text>
  <rect x="35" y="352" width="1730" height="190" class="layer"/>

  <rect x="58" y="376" width="420" height="140" class="box"/>
  <text x="78" y="405" class="box-title">Domain + agent orchestration</text>
  <text x="78" y="425" class="box-path">orchestrator/ · agents/ · domain_packs/</text>
  <text x="78" y="451" class="body">ResearchCoordinator / StepScheduler</text>
  <text x="78" y="472" class="body">Food policy, intent, analysis, POI enrichment</text>
  <text x="78" y="493" class="small">Target: Pydantic AI V2 · legacy facade remains routable</text>

  <rect x="526" y="376" width="440" height="140" class="box-blue"/>
  <text x="546" y="405" class="box-title">Source Gateway + capability mux</text>
  <text x="546" y="425" class="box-path">gateways/platform_gateway.py · capabilities.py</text>
  <text x="546" y="451" class="body">Grant → account → session → PG lease → connector</text>
  <text x="546" y="472" class="body">Legacy SourceGateway remains default when flag off</text>
  <text x="546" y="493" class="small">Explicit source/version resolves place.lookup collisions</text>

  <rect x="1014" y="376" width="350" height="140" class="box-purple"/>
  <text x="1034" y="405" class="box-title">Temporal durable runtime</text>
  <text x="1034" y="425" class="box-path">foundation/temporal.py · temporalio</text>
  <text x="1034" y="451" class="body">research · refresh · media queues</text>
  <text x="1034" y="472" class="body">account-auth queue is optional / qualified</text>
  <text x="1034" y="493" class="small">唯一 durable checkpoint; bounded retry/heartbeat</text>

  <rect x="1412" y="376" width="295" height="140" class="box-amber"/>
  <text x="1432" y="405" class="box-title">Activity workers</text>
  <text x="1432" y="425" class="box-path">Temporal workers / local sidecar</text>
  <text x="1432" y="451" class="body">one account + client per activity</text>
  <text x="1432" y="472" class="body">decrypt/use/zeroize/release lease</text>
  <text x="1432" y="493" class="small">No cookies or QR bytes in workflow history</text>

  <path d="M478 446 H526" class="arrow"/>
  <path d="M966 446 H1014" class="arrow"/>
  <path d="M1364 446 H1412" class="arrow"/>
  <path d="M1041 300 V376" class="arrow-optional"/>
  <text x="1050" y="326" class="tiny">durable calls</text>
  <path d="M1040 542 V579" class="arrow"/>

  <!-- Layer 3 -->
  <text x="48" y="580" class="section">03  AUTHORITY, PROVIDER ADAPTERS &amp; STATE</text>
  <rect x="35" y="594" width="1730" height="206" class="layer"/>

  <rect x="58" y="620" width="390" height="152" class="box-green"/>
  <text x="78" y="649" class="box-title">Account control plane</text>
  <text x="78" y="669" class="box-path">foundation/platform_accounts.py</text>
  <text x="78" y="689" class="body">SQLAlchemy repository + Alembic schema</text>
  <text x="78" y="710" class="body">AES-GCM envelope / grant / lease / health</text>
  <text x="78" y="731" class="body">Login flow + QR object reference</text>
  <text x="78" y="752" class="small">Natural key: tenant × channel × account_ref</text>

  <rect x="490" y="620" width="505" height="152" class="box-blue"/>
  <text x="510" y="649" class="box-title">Platform source adapters</text>
  <text x="510" y="669" class="box-path">gateways/platform_sources.py · composition/adapters/platforms.py</text>
  <text x="510" y="689" class="body">Dianping: Playwright protocol bridge (search/detail/reviews)</text>
  <text x="510" y="710" class="body">XHS PC: note/detail/comments/media; Creator: read/health only</text>
  <text x="510" y="731" class="body">Canonical URL/media/error normalization</text>
  <text x="510" y="752" class="small">Pinned checkout; provider API/SQLite/worker excluded</text>

  <rect x="1037" y="620" width="345" height="152" class="box"/>
  <text x="1057" y="649" class="box-title">Business + hot state</text>
  <text x="1057" y="669" class="box-path">PostgreSQL 16 + pgvector/pg_trgm</text>
  <text x="1057" y="689" class="body">business facts / evidence / account authority</text>
  <text x="1057" y="710" class="box-path">Redis 7</text>
  <text x="1057" y="730" class="body">SSE stream / short TTL status / rate projections</text>
  <text x="1057" y="752" class="small">Redis is rebuildable; never lease or durable truth</text>

  <rect x="1424" y="620" width="283" height="152" class="box-amber"/>
  <text x="1444" y="649" class="box-title">Object + model services</text>
  <text x="1444" y="669" class="box-path">S3-compatible ObjectStore</text>
  <text x="1444" y="689" class="body">AWS S3 / MinIO (QR + media refs)</text>
  <text x="1444" y="710" class="box-path">OpenAI-compatible LLM</text>
  <text x="1444" y="730" class="body">SiliconFlow / OpenAI / DeepSeek</text>
  <text x="1444" y="752" class="small">Signed refs, bounded payloads, redacted telemetry</text>

  <path d="M478 696 H490" class="arrow"/>
  <path d="M995 696 H1037" class="arrow"/>
  <path d="M1382 696 H1424" class="arrow"/>
  <path d="M250 542 V620" class="arrow"/>
  <path d="M726 542 V620" class="arrow"/>
  <path d="M1188 542 V620" class="arrow"/>

  <!-- External provider boundary -->
  <rect x="35" y="838" width="1730" height="185" class="boundary"/>
  <text x="58" y="866" class="section" fill="#fcd34d">04  EXTERNAL / ISOLATED PROVIDER BOUNDARY</text>
  <rect x="58" y="884" width="440" height="112" class="box-red"/>
  <text x="78" y="913" class="box-title">Dianping upstream snapshot</text>
  <text x="78" y="933" class="box-path">MARYCOMPLEX/dazhongdianping @ ffbc1d4…</text>
  <text x="78" y="957" class="body">Allowed auth + protocol modules only</text>
  <text x="78" y="978" class="small">Playwright browser context is activity-local</text>

  <rect x="526" y="884" width="440" height="112" class="box-red"/>
  <text x="546" y="913" class="box-title">Spider_XHS upstream snapshot</text>
  <text x="546" y="933" class="box-path">cv-cat/Spider_XHS @ e1888d7…</text>
  <text x="546" y="957" class="body">PC / Creator auth + read protocol modules</text>
  <text x="546" y="978" class="small">Node signer is hash-pinned and resource-bounded</text>

  <rect x="994" y="884" width="330" height="112" class="box-purple"/>
  <text x="1014" y="913" class="box-title">Optional sidecar</text>
  <text x="1014" y="933" class="box-path">Python 3.10+ / Node 20</text>
  <text x="1014" y="957" class="body">Typed adapter transport only</text>
  <text x="1014" y="978" class="small">No secret-bearing logs or global cookie</text>

  <rect x="1352" y="884" width="355" height="112" class="box-amber"/>
  <text x="1372" y="913" class="box-title">Platform endpoints</text>
  <text x="1372" y="933" class="box-path">Dianping / Xiaohongshu</text>
  <text x="1372" y="957" class="body">risk, 406/429, auth expiry, timeout</text>
  <text x="1372" y="978" class="small">Mapped to stable ContractError taxonomy</text>

  <path d="M250 772 V884" class="arrow-optional"/>
  <path d="M742 772 V884" class="arrow-optional"/>
  <path d="M1158 772 V884" class="arrow-optional"/>
  <path d="M1534 772 V884" class="arrow-optional"/>

  <!-- Guardrails -->
  <rect x="35" y="1048" width="1730" height="142" fill="#0f172a" stroke="#475569" stroke-width="1.2" rx="16"/>
  <text x="58" y="1076" class="section">GUARDRAILS / OPERATING CONTRACT</text>
  <line x1="460" y1="1060" x2="460" y2="1174" class="divider"/>
  <line x1="885" y1="1060" x2="885" y2="1174" class="divider"/>
  <line x1="1310" y1="1060" x2="1310" y2="1174" class="divider"/>
  <text x="78" y="1103" class="box-title">Account isolation</text>
  <text x="78" y="1124" class="small">tenant × platform channel × account</text>
  <text x="78" y="1144" class="small">PG lease + CAS session version</text>
  <text x="78" y="1164" class="small">PC and Creator never share state</text>
  <text x="488" y="1103" class="box-title">Secret boundary</text>
  <text x="488" y="1124" class="small">AES-GCM envelope; material is transient</text>
  <text x="488" y="1144" class="small">No cookies/QR in Temporal, SSE, evidence</text>
  <text x="488" y="1164" class="small">URLs strip xsec_token/signature/query access</text>
  <text x="913" y="1103" class="box-title">Dependency boundary</text>
  <text x="913" y="1124" class="small">Alembic owns schema; Temporal owns durability</text>
  <text x="913" y="1144" class="small">Redis is hot/rebuildable only</text>
  <text x="913" y="1164" class="small">No upstream API/SQLite/worker/retry queue</text>
  <text x="1338" y="1103" class="box-title">Rollout</text>
  <text x="1338" y="1124" class="small">Flags + provenance + license gate</text>
  <text x="1338" y="1144" class="small">Canary by tenant/account; aggregate metrics</text>
  <text x="1338" y="1164" class="small">Disable flag → prior connector; no pointer rewrite</text>

  <!-- Legend -->
  <line x1="58" y1="1211" x2="110" y2="1211" class="arrow"/>
  <text x="120" y="1216" class="tiny">required interaction</text>
  <line x1="280" y1="1211" x2="332" y2="1211" class="arrow-optional"/>
  <text x="342" y="1216" class="tiny">optional / feature-gated</text>
  <line x1="540" y1="1211" x2="592" y2="1211" class="arrow-telemetry"/>
  <text x="602" y="1216" class="tiny">telemetry / health projection</text>
  <text x="1740" y="1216" text-anchor="end" class="tiny">Python 3.12 · FastAPI · SQLAlchemy 2 async · Redis 7 · Temporal · S3/MinIO</text>
</svg>
