name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Backend lint & test
    runs-on: ubuntu-latest

    # GH Actions service containers — bound to localhost in the job
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xhs_food_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xhs_food_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: xhs_food_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Dummy values so settings validation passes in CI
      OPENAI_API_KEY: "ci-dummy-key"
      OPENAI_API_BASE: "https://api.openai.com/v1/"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies (incl. dev extras)
        run: uv sync --frozen --extra dev --python 3.12

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d xhs_food_agent \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Ruff critical gate
        run: uv run --frozen ruff check src/ tests/ --select E9,F63,F7,F82

      - name: Ruff full baseline report
        continue-on-error: true
        run: uv run --frozen ruff check src/ tests/

      - name: Pyright type-check
        # Not gating CI yet — type errors are tracked but allowed to land
        continue-on-error: true
        run: uv run --frozen pyright src/

      - name: Pytest (unit + integration)
        # Integration tests rely on redis/postgres + env vars set above.
        # Live and browser suites run in their dedicated, credentialed jobs.
        run: uv run --frozen pytest --cov=src --cov-report=xml -m "unit or integration"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  platform-probe:
    name: macOS arm64 compatibility probe (non-blocking)
    runs-on: macos-14
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      - name: Verify frozen lock and install dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev --python 3.12

      - name: Record macOS arm64 probe
        run: uv run --frozen python scripts/qualification_platform_probe.py --expected-os Darwin --expected-arch arm64 --output platform-probe.json

      - name: Run platform-independent contract probes
        run: uv run --frozen pytest -q tests/test_unit_contract_sdk.py tests/test_architecture_docs_drift.py tests/test_b2_canary_cli.py tests/test_platform_probe.py

      - name: Upload platform probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-platform-probe
          path: platform-probe.json
          if-no-files-found: ignore
