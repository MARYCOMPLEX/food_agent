components:
  schemas:
    AccountServiceInvokeRequest:
      properties:
        account_ref:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Account Ref
        capability:
          type: string
          maxLength: 128
          minLength: 1
          title: Capability
        correlation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Correlation Id
        query:
          additionalProperties: true
          type: object
          title: Query
        expected_session_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Session Version
        timeout_seconds:
          type: number
          maximum: 300.0
          exclusiveMinimum: 0.1
          title: Timeout Seconds
          default: 30.0
      additionalProperties: false
      type: object
      required:
      - account_ref
      - capability
      - correlation_id
      title: AccountServiceInvokeRequest
    AccountServiceToolCallRequest:
      properties:
        arguments:
          additionalProperties: true
          type: object
          title: Arguments
      additionalProperties: false
      type: object
      title: AccountServiceToolCallRequest
    FavoriteAddRequest:
      properties:
        restaurantId:
          type: string
          title: Restaurantid
          description: 餐厅Hash ID (32字符)
      type: object
      required:
      - restaurantId
      title: FavoriteAddRequest
      description: POST /v1/favorites 请求体.
    FavoriteResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        message:
          type: string
          title: Message
          default: ''
        isFavorite:
          type: boolean
          title: Isfavorite
          default: false
      type: object
      title: FavoriteResponse
      description: 收藏操作响应.
    FeedbackRequest:
      properties:
        type:
          type: string
          title: Type
          description: '类型: bug, feature, other'
        content:
          type: string
          title: Content
          description: 反馈内容
        contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact
      type: object
      required:
      - type
      - content
      title: FeedbackRequest
      description: POST /v1/help/feedback 请求体.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HistoryAddRequest:
      properties:
        query:
          type: string
          title: Query
          description: 搜索查询
        resultsCount:
          type: integer
          title: Resultscount
          description: 结果数量
          default: 0
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
          description: 搜索位置
      type: object
      required:
      - query
      title: HistoryAddRequest
      description: POST /v1/history 请求体.
    PlatformAccountCreateRequest:
      properties:
        platform:
          type: string
          maxLength: 32
          minLength: 1
          title: Platform
        account_ref:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          title: Account Ref
        alias:
          type: string
          maxLength: 128
          minLength: 1
          title: Alias
        permissions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Permissions
      additionalProperties: false
      type: object
      required:
      - platform
      - account_ref
      - alias
      title: PlatformAccountCreateRequest
    PlatformCancelRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      title: PlatformCancelRequest
    PlatformLoginStartRequest:
      properties:
        mode:
          type: string
          maxLength: 16
          minLength: 1
          title: Mode
          default: qr
        credential_ref:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          - type: 'null'
          title: Credential Ref
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Idempotency Key
      additionalProperties: false
      type: object
      title: PlatformLoginStartRequest
    PlatformReauthRequest:
      properties:
        mode:
          type: string
          maxLength: 16
          minLength: 1
          title: Mode
          default: qr
        credential_ref:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          - type: 'null'
          title: Credential Ref
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Idempotency Key
      additionalProperties: false
      type: object
      title: PlatformReauthRequest
      description: Re-authentication command; raw phone/cookie values are not fields.
    SearchResultsResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        data:
          additionalProperties: true
          type: object
          title: Data
      type: object
      title: SearchResultsResponse
      description: GET /v1/search/results/{sessionId} 响应体.
    SearchStatusResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        data:
          additionalProperties: true
          type: object
          title: Data
      type: object
      title: SearchStatusResponse
      description: GET /v1/search/status/{sessionId} 响应体.
    UnifiedSearchRequest:
      properties:
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
          description: 搜索查询（新查询/追问时必填）
        sessionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Sessionid
          description: 会话ID（复用现有会话时填写）
        location:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Location
          description: 位置坐标 {lat, lng}
      type: object
      title: UnifiedSearchRequest
      description: 'POST /v1/search 统一请求体.


        智能判断操作类型：

        - 无 sessionId → 新查询（必须有 query）

        - 有 sessionId + query → 追问/继续对话

        - 有 sessionId + 无 query → 恢复历史会话'
    UserProfileUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
      type: object
      title: UserProfileUpdateRequest
      description: PUT /v1/user/profile 请求体.
    UserSettingsUpdateRequest:
      properties:
        notifications:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Notifications
        privacy:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Privacy
        preferences:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Preferences
      type: object
      title: UserSettingsUpdateRequest
      description: PUT /v1/user/settings 请求体 (批量更新).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
