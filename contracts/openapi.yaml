openapi: 3.1.0
info:
  title: XHS Food Agent API
  description: 小红书美食智能推荐 Agent — Production API
  version: 1.0.0
paths:
  /v1/search/:
    post:
      tags:
      - search
      summary: Unified Search
      description: Single entry point — branches on ``(sessionId, query)`` presence.
      operationId: unified_search_v1_search__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/search/stream/{sessionId}:
    get:
      tags:
      - search
      summary: Search Stream
      description: 'Server-sent events with Redis-Stream-backed replay.


        The browser''s ``EventSource`` records ``id:`` on every event and sends

        it back as ``Last-Event-ID`` on reconnect. The EventBus replays from

        that id, so the client needs no special reconnection logic.'
      operationId: search_stream_v1_search_stream__sessionId__get
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          description: 会话ID
          title: Sessionid
        description: 会话ID
      - name: sseVersion
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sseversion
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/search/status/{sessionId}:
    get:
      tags:
      - search
      summary: Search Status
      operationId: search_status_v1_search_status__sessionId__get
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
