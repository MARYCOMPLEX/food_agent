# Full release qualification stack. It is deliberately separate from the
# legacy compose manifest, whose current differences remain characterization.

name: food-agent-release-gate

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.release
    image: xhs-food-agent:release-gate
    env_file:
      - path: .env
        required: false
    environment:
      EVENT_BUS_BACKEND: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xhs_food_agent
      MODULAR_TEMPORAL_ADDRESS: temporal:7233
      MODULAR_TEMPORAL_NAMESPACE: default
      MODULAR_OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      MODULAR_OBJECT_STORE_BUCKET: food-agent
      MODULAR_OBJECT_STORE_REGION: us-east-1
      MODULAR_OBJECT_STORE_ACCESS_KEY: minioadmin
      MODULAR_OBJECT_STORE_SECRET_KEY: minioadmin
      MODULAR_OBJECT_STORE_ENVIRONMENT: local
      MODULAR_OBJECT_STORE_SERVER_SIDE_ENCRYPTION: test
    ports:
      - "18000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    volumes:
      - release_profiles:/app/.xhs_profiles
      - release_logs:/app/logs

  migrate:
    image: xhs-food-agent:release-gate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xhs_food_agent
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  research-queue-smoke:
    image: xhs-food-agent:release-gate
    command: ["python", "/app/scripts/queue_smoke_worker.py"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      QUEUE: research
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"

  refresh-queue-smoke:
    image: xhs-food-agent:release-gate
    command: ["python", "/app/scripts/queue_smoke_worker.py"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      QUEUE: refresh
    depends_on:
      temporal:
        condition: service_healthy
      research-queue-smoke:
        condition: service_completed_successfully
    restart: "no"

  media-queue-smoke:
    image: xhs-food-agent:release-gate
    command: ["python", "/app/scripts/queue_smoke_worker.py"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      QUEUE: media
    depends_on:
      temporal:
        condition: service_healthy
      refresh-queue-smoke:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: xhs_food_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - release_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_release_db.sql:/docker-entrypoint-initdb.d/00-release.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xhs_food_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - release_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.28.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 7d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "17233:7233"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'addr=$$(hostname -i); echo > /dev/tcp/$$addr/7233'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - release_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  release_logs:
  release_minio_data:
  release_postgres_data:
  release_profiles:
  release_redis_data:
